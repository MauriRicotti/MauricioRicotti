<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Animación de entrada: deja el hero listo para animar (ver index.css y main.tsx) -->
    <script>
      document.documentElement.classList.add("intro-wait");
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mauricio Ricotti | Full Stack Developer</title>
    <meta
      name="description"
      content="Portfolio de Mauricio Ricotti, Full Stack Developer en Buenos Aires, Argentina. Desarrollo sitios y aplicaciones web rápidas con React, TypeScript y Node.js."
    />
    <meta name="author" content="Mauricio Ricotti" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <!-- Versiones por idioma (la de inglés se genera sola al compilar: /en) -->
    <link rel="alternate" hreflang="es" href="%VITE_SITE_URL%/" />
    <link rel="alternate" hreflang="en" href="%VITE_SITE_URL%/en" />
    <link rel="alternate" hreflang="x-default" href="%VITE_SITE_URL%/" />
    <meta name="theme-color" content="#0e0f12" />
    <meta name="color-scheme" content="dark" />

    <!-- Íconos (monograma MR) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Vista previa al compartir (WhatsApp, LinkedIn, Facebook, Discord…) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:site_name" content="Mauricio Ricotti" />
    <meta property="og:title" content="Mauricio Ricotti | Full Stack Developer" />
    <meta
      property="og:description"
      content="Desarrollo sitios y aplicaciones web rápidas, de punta a punta: React, TypeScript y Node.js. Mirá mis proyectos y hablemos."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta
      property="og:image:alt"
      content="Mauricio Ricotti — Full Stack Developer"
    />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mauricio Ricotti | Full Stack Developer" />
    <meta
      name="twitter:description"
      content="Desarrollo sitios y aplicaciones web rápidas, de punta a punta: React, TypeScript y Node.js."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />

    <!-- Datos estructurados para Google (persona + profesión) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Mauricio Ricotti",
        "jobTitle": "Full Stack Developer",
        "url": "%VITE_SITE_URL%/",
        "image": "%VITE_SITE_URL%/og-image.jpg",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Florencio Varela",
          "addressRegion": "Buenos Aires",
          "addressCountry": "AR"
        },
        "knowsAbout": ["React", "TypeScript", "JavaScript", "Node.js", "Desarrollo web"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
