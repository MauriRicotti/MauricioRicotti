.skill-group+.skill-group{margin-top:2.7mm}.skill-title{font-size:7.1pt;line-height:1.3;text-transform:uppercase;font-weight:750;letter-spacing:.08em;color:#51555c;margin-bottom:1.15mm!important}.skill-items{font-size:8.2pt;line-height:1.57;color:#2d3037}.skill-items .dot{color:#a5a1a0;font-size:7pt;padding:0 .65mm}.services li{font-size:8.15pt;line-height:1.4;padding:.9mm 0;border-top:1px solid #e6e3dd}.services li:first-child{padding-top:0;border-top:0}.process-list li{font-size:8.1pt;line-height:1.4;display:grid;grid-template-columns:3mm minmax(0,1fr);gap:1.2mm;align-items:baseline;padding:.8mm 0}.step-num{font-size:6.7pt;color:var(--color-accent);font-weight:750;font-variant-numeric:tabular-nums}.language-line{font-size:8.2pt;line-height:1.5;color:#4c5057}.language-line strong{font-weight:700;color:var(--ink)}
.cv-footer{margin:4mm 13mm 5.5mm;padding-top:2.4mm;border-top:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:4mm;color:#7c7f86;font-size:6.8pt;line-height:1.4}.footer-brand{display:flex;align-items:center;gap:2.2mm}.footer-logo{display:block;width:10mm;line-height:0}.footer-logo svg{display:block;width:100%;height:auto}.footer-name{display:block;color:#383b42;font-size:7.1pt;font-weight:700}.footer-site{display:block;font-size:6.6pt;color:#7c7f86}.footer-updated{text-align:right}.footer-updated strong{color:#54585e;font-weight:600}

<script>
const DATA=JSON.parse(document.getElementById('cv-data').textContent);
const SITE=__CV_SITE_JSON__,LOGO=__CV_LOGO_JSON__;
const EXTRA=__CV_EXTRA_JSON__,INITIAL_LANG=__CV_LANG_JSON__;
const LABELS=__CV_LABELS_JSON__;
const esc=(s='')=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const host=(u)=>new URL(u).host.replace(/^www\./,'');
const title=(n,t)=>'<h2 class="section-title"><span class="num" aria-hidden="true">'+n+'</span>'+esc(t)+'</h2>';
const sentence=s=>esc(s)+(/[.!?]$/.test(s)?'':'.');
let actual=false;
function render(l){
 const c=DATA[l],p=c.profile,L=LABELS[l],site=SITE+(l==='en'?'/en':'');
 const extra=EXTRA[l];
 const list=rows=>rows.map(([name,detail])=>'<p class="language-line"><strong>'+esc(name)+'</strong>'+(detail?' · '+esc(detail):'')+'</p>').join('');
 const education=extra.education.length?'<section data-section="education">'+title('06',L.education)+list(extra.education)+'</section>':'';
 const languages=extra.languages.length?'<section data-section="languages">'+title(extra.education.length?'07':'06',L.languages)+list(extra.languages)+'</section>':'';
 const github=p.socials.find(s=>s.label==='GitHub'&&s.url&&!s.url.includes('tu-usuario'));
 const linkedin=p.socials.find(s=>s.label==='LinkedIn'&&s.url&&!s.url.includes('tu-usuario'));
 const contacts=[['mailto:'+p.email,p.email],...(p.whatsapp&&p.phone?[['https://wa.me/'+p.whatsapp,p.phone]]:[]),[site,host(site)],...(github?[[github.url,host(github.url)+new URL(github.url).pathname]]:[]),...(linkedin?[[linkedin.url,'LinkedIn']]:[])];
 const role=p.role.trim().split(/\s+/),last=role.pop();
 const projects=c.projects.map(pr=>'<article class="project" data-project="'+esc(pr.id)+'"><div class="project-heading"><h3 class="project-name">'+esc(pr.name)+'</h3><span class="project-category">'+esc(pr.category)+(pr.highlight?' · <b class="highlight">'+esc(pr.highlight)+'</b>':'')+'</span>'+(pr.demoUrl?'<a class="project-link" href="'+esc(pr.demoUrl)+'">'+esc(host(pr.demoUrl))+' ↗</a>':'')+'</div><p class="project-desc"><strong>'+sentence(pr.subtitle)+'</strong> '+esc(pr.description)+'</p><p class="project-tags">'+pr.tags.map(esc).join(' · ')+'</p></article>').join('');
 const skills=c.techStack.map(g=>'<div class="skill-group"><h3 class="skill-title">'+esc(g.title)+'</h3><p class="skill-items">'+g.items.map(i=>esc(i.name)).join('<span class="dot" aria-hidden="true"> · </span>')+'</p></div>').join('');
 const sheet=document.getElementById('sheet');sheet.lang=l;sheet.setAttribute('aria-label',L.kicker+' — '+p.name);
 sheet.innerHTML='<header class="cv-header"><div class="cv-brand"><div class="cv-logo" aria-hidden="true">'+LOGO+'</div><div class="cv-identity"><p class="cv-kicker">'+L.kicker+'</p><h1 class="cv-name">'+esc(p.name)+'</h1><p class="cv-role">'+esc(role.join(' '))+' <span class="accent">'+esc(last)+'</span></p></div></div><ul class="cv-contact">'+contacts.map(([u,label])=>'<li><a href="'+esc(u)+'">'+esc(label)+'</a></li>').join('')+'<li class="location">'+esc(p.location)+'</li></ul></header><div class="cv-body"><div class="cv-main"><section data-section="profile">'+title('01',L.profile)+c.about.paragraphs.map(t=>'<p class="intro">'+esc(t)+'</p>').join('')+'</section><section data-section="projects">'+title('02',L.projects)+projects+'</section></div><aside class="cv-side"><section data-section="skills">'+title('03',L.skills)+skills+'</section><section data-section="services">'+title('04',L.services)+'<ul class="services">'+c.about.services.map(s=>'<li>'+esc(s.title)+'</li>').join('')+'</ul></section><section data-section="process">'+title('05',L.process)+'<ol class="process-list">'+c.processSteps.map((s,i)=>'<li><span class="step-num" aria-hidden="true">'+String(i+1).padStart(2,'0')+'</span><span>'+esc(s.title)+'</span></li>').join('')+'</ol></section>'+education+languages+'</aside></div><footer class="cv-footer"><div class="footer-brand"><div class="footer-logo" aria-hidden="true">'+LOGO+'</div><div><strong class="footer-name">'+esc(p.name)+'</strong><a class="footer-site" href="'+esc(site)+'">'+esc(host(site))+'</a></div></div><div class="footer-updated">'+L.updated+'<br><strong>'+L.month+'</strong></div></footer>';
 document.documentElement.lang=l;document.title=p.name+' — CV — '+l.toUpperCase();
 for(const btn of document.querySelectorAll('[data-lang]'))btn.setAttribute('aria-pressed',String(btn.dataset.lang===l));
 document.fonts.ready.then(()=>{fit();window.__cvReady=true});
}
function fit(){const workspace=document.querySelector('.workspace'),style=getComputedStyle(workspace),available=workspace.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight);const sheet=document.getElementById('sheet'),scale=actual?1:Math.min(1,available/sheet.offsetWidth),frame=document.getElementById('frame');sheet.style.transform='scale('+scale+')';frame.style.width=sheet.offsetWidth*scale+'px';frame.style.height=sheet.offsetHeight*scale+'px';}
for(const btn of document.querySelectorAll('[data-lang]'))btn.addEventListener('click',()=>render(btn.dataset.lang));
document.getElementById('zoom').addEventListener('click',e=>{actual=!actual;e.currentTarget.textContent=actual?'Ajustar':'100%';e.currentTarget.setAttribute('aria-pressed',String(actual));fit()});
window.addEventListener('resize',fit);window.__setCVLang=render;render(INITIAL_LANG);
</script></body></html>
